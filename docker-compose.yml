version: '3.8'

services:
  # 1. PostgreSQL Veritabanı
  db:
    image: postgres:15-alpine
    container_name: event-app-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Next.js Uygulaması
  web:
    build: .
    container_name: event-app-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/eventdb
      - AUTH_SECRET=gelistirme-icin-gecici-bir-anahtar-1234567890
      - AUTH_TRUST_HOST=true
    depends_on:
      - db

  # 3. WebSocket Sunucusu
  ws:
    build:
      context: .
      dockerfile: Dockerfile.ws
    container_name: event-app-ws
    restart: unless-stopped
    environment:
      - PORT=8080
    depends_on:
      - db

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: event-app-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - ws

volumes:
  postgres_data: